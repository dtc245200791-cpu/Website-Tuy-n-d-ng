version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: jobboard_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootAdminSecure_2026!@#}
      MYSQL_DATABASE: ${DB_NAME:-jobboard_db}
      MYSQL_USER: ${DB_USER:-jobboard_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-JobBoardSecure_2026!@#}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootAdminSecure_2026!@#}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Công cụ quản lý Database phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jobboard_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-jobboard_user}
      PMA_PASSWORD: ${DB_PASSWORD:-JobBoardSecure_2026!@#}
      UPLOAD_LIMIT: 50M
    ports:
      - "${PMA_PORT:-8080}:80"
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy

  # 3. Ứng dụng Web Tuyển Dụng (Node.js Express)
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: jobboard_app
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-jobboard_db}
      DB_USER: ${DB_USER:-jobboard_user}
      DB_PASSWORD: ${DB_PASSWORD:-JobBoardSecure_2026!@#}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./app/uploads:/app/uploads
      - ./app/logs:/app/logs
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy

  # 4. Nginx Reverse Proxy (HTTPS & Security Headers)
  nginx:
    image: nginx:1.25-alpine
    container_name: jobboard_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    networks:
      - app_network
    depends_on:
      - app

  # 5. MySQL Exporter (Thu thập số liệu CSDL cho Prometheus)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: jobboard_mysqld_exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "${DB_USER:-jobboard_user}:${DB_PASSWORD:-JobBoardSecure_2026!@#}(mysql:3306)/"
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy

  # 6. Prometheus (Thu thập và lưu trữ Metrics hệ thống)
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: jobboard_prometheus
    restart: always
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - app_network
    depends_on:
      - app
      - mysqld-exporter

  # 7. Grafana (Hiển thị biểu đồ giám sát Dashboard trực quan)
  grafana:
    image: grafana/grafana:10.3.3
    container_name: jobboard_grafana
    restart: always
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-AdminSecure_2026!@#}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - app_network
    depends_on:
      - prometheus

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
  nginx_logs:
  prometheus_data:
  grafana_data:
