version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: jobboard_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootAdminSecure_2026!@#}
      MYSQL_DATABASE: ${DB_NAME:-jobboard_db}
      MYSQL_USER: ${DB_USER:-jobboard_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-JobBoardSecure_2026!@#}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootAdminSecure_2026!@#}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Công cụ quản lý Database phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jobboard_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-jobboard_user}
      PMA_PASSWORD: ${DB_PASSWORD:-JobBoardSecure_2026!@#}
      UPLOAD_LIMIT: 50M
    ports:
      - "${PMA_PORT:-8080}:80"
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy

  # 3. Ứng dụng Web Tuyển Dụng (Node.js Express)
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: jobboard_app
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-jobboard_db}
      DB_USER: ${DB_USER:-jobboard_user}
      DB_PASSWORD: ${DB_PASSWORD:-JobBoardSecure_2026!@#}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./app/uploads:/app/uploads
      - ./app/logs:/app/logs
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy

  # 4. Nginx Reverse Proxy (HTTPS & Security Headers)
  nginx:
    image: nginx:1.25-alpine
    container_name: jobboard_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    networks:
      - app_network
    depends_on:
      - app

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
  nginx_logs:
