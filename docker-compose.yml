version: '3.8'

services:
  # ============================================================================
  # 1. DATABASE LAYER (MySQL 8.0)
  # Hardening: Isolated in backend_net (internal: true), no direct host port exposure
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: jobboard_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootAdminSecure_2026!@#}
      MYSQL_DATABASE: ${DB_NAME:-jobboard_db}
      MYSQL_USER: ${DB_USER:-jobboard_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-JobBoardSecure_2026!@#}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootAdminSecure_2026!@#}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. DATABASE MANAGEMENT TOOL (phpMyAdmin)
  # ============================================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jobboard_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-jobboard_user}
      PMA_PASSWORD: ${DB_PASSWORD:-JobBoardSecure_2026!@#}
      UPLOAD_LIMIT: 50M
    ports:
      - "${PMA_PORT:-8080}:80"
    networks:
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      mysql:
        condition: service_healthy

  # ============================================================================
  # 3. WEB APPLICATION (Job Board - Node.js Express)
  # Hardening: Runs as non-root user (USER node: 1000)
  # ============================================================================
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: jobboard_app
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-jobboard_db}
      DB_USER: ${DB_USER:-jobboard_user}
      DB_PASSWORD: ${DB_PASSWORD:-JobBoardSecure_2026!@#}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./app/uploads:/app/uploads
      - app_logs:/app/logs
    networks:
      - frontend_net
      - backend_net
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      mysql:
        condition: service_healthy

  # ============================================================================
  # 4. REVERSE PROXY (Nginx with HTTPS & Security Headers)
  # Hardening: SSL/TLS, Strict-Transport-Security, CSP, X-Frame-Options, server_tokens off
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: jobboard_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-8088}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend_net
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      - app

  # ============================================================================
  # 5. DATABASE EXPORTER (MySQL Exporter for Prometheus)
  # ============================================================================
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: jobboard_mysqld_exporter
    restart: always
    environment:
      MYSQLD_PASSWORD: "${DB_PASSWORD:-JobBoardSecure_2026!@#}"
    command:
      - "--mysqld.address=mysql:3306"
      - "--mysqld.username=${DB_USER:-jobboard_user}"
    networks:
      - backend_net
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    depends_on:
      mysql:
        condition: service_healthy

  # ============================================================================
  # 6. MONITORING: PROMETHEUS
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: jobboard_prometheus
    restart: always
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - app
      - mysqld-exporter

  # ============================================================================
  # 7. MONITORING: GRAFANA
  # Provisioned with Prometheus & Loki datasources, and Job Board Dashboard
  # ============================================================================
  grafana:
    image: grafana/grafana:10.3.3
    container_name: jobboard_grafana
    restart: always
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-AdminSecure_2026!@#}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - frontend_net
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - prometheus

  # ============================================================================
  # 8. CENTRALIZED LOGGING: LOKI
  # Stores structured application and Nginx logs
  # ============================================================================
  loki:
    image: grafana/loki:2.9.4
    container_name: jobboard_loki
    restart: always
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # 9. CENTRALIZED LOGGING: PROMTAIL
  # Collects logs from App & Nginx and ships to Loki
  # ============================================================================
  promtail:
    image: grafana/promtail:2.9.4
    container_name: jobboard_promtail
    restart: always
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - app_logs:/var/log/app:ro
      - nginx_logs:/var/log/nginx:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    depends_on:
      - loki

# ==============================================================================
# NETWORKS CONFIGURATION (Network Isolation Hardening)
# ==============================================================================
networks:
  # External/Public-facing network: Nginx, Web App, phpMyAdmin, Grafana
  frontend_net:
    driver: bridge

  # Internal/Isolated database network: MySQL, Web App, mysqld-exporter
  # Hardening: internal: true prevents any outside routing directly to MySQL
  backend_net:
    driver: bridge
    internal: true

  # Monitoring network: Prometheus, Loki, Promtail, Grafana, Exporters
  monitoring_net:
    driver: bridge

# ==============================================================================
# VOLUMES CONFIGURATION
# ==============================================================================
volumes:
  mysql_data:
  app_logs:
  nginx_logs:
  prometheus_data:
  grafana_data:
  loki_data:
